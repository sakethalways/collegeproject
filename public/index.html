<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IARE Content Auditor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #07101e;
      --surface:   #0c1a2e;
      --surface2:  #112240;
      --border:    #1a3050;
      --border2:   #1e3a5f;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --subtle:    #94a3b8;
      --accent:    #2563eb;
      --accent2:   #3b82f6;
      --gold:      #f59e0b;
      --red:       #ef4444;
      --red-bg:    #1a0808;
      --red-bd:    #7f1d1d;
      --green:     #22c55e;
      --green-bg:  #071a0f;
      --green-bd:  #14532d;
      --blue:      #3b82f6;
      --blue-bg:   #060f1e;
      --blue-bd:   #1e3a5f;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ─── Header ─── */
    header {
      background: linear-gradient(135deg, #0c1a2e 0%, #07101e 100%);
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      display: flex;
      align-items: center;
      gap: 20px;
      height: 70px;
    }
    .iare-logo {
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      color: white;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.05em;
      padding: 6px 12px;
      border-radius: 6px;
    }
    .header-divider { width: 1px; height: 30px; background: var(--border); }
    header h1 { font-size: 17px; font-weight: 700; color: #f1f5f9; }
    header p  { font-size: 12px; color: var(--muted); }
    .header-badge {
      margin-left: auto;
      background: rgba(37,99,235,0.12);
      border: 1px solid rgba(37,99,235,0.3);
      color: #60a5fa;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 0.05em;
    }

    /* ─── Container ─── */
    .container { max-width: 1440px; margin: 0 auto; padding: 36px 28px; }

    /* ─── Page selector section ─── */
    .selector-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 16px;
    }

    .pages-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      margin-bottom: 36px;
    }
    @media (max-width: 1100px) { .pages-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 700px)  { .pages-grid { grid-template-columns: 1fr 1fr; } }

    .page-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 18px;
      cursor: pointer;
      transition: all 0.18s;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .page-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(37,99,235,0.06), transparent);
      opacity: 0;
      transition: opacity 0.18s;
    }
    .page-card:hover { border-color: var(--accent2); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(37,99,235,0.12); }
    .page-card:hover::before { opacity: 1; }
    .page-card.active {
      border-color: var(--accent2);
      background: rgba(37,99,235,0.08);
      box-shadow: 0 0 0 1px var(--accent2), 0 8px 24px rgba(37,99,235,0.16);
    }
    .page-card.active::before { opacity: 1; }

    .card-icon {
      width: 38px; height: 38px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .card-num {
      font-size: 10px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
    }
    .card-url {
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .audit-btn {
      margin-top: auto;
      padding: 8px 0;
      border-radius: 8px;
      border: 1px solid var(--border2);
      background: rgba(255,255,255,0.03);
      color: var(--subtle);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      width: 100%;
    }
    .audit-btn:hover { background: rgba(37,99,235,0.15); border-color: var(--accent2); color: #93c5fd; }
    .audit-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .audit-btn.loading-btn {
      background: rgba(37,99,235,0.1);
      border-color: var(--accent);
      color: #60a5fa;
    }

    /* ─── Loading ─── */
    .loading {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
      gap: 18px;
    }
    .loader-ring {
      width: 46px; height: 46px;
      border: 3px solid var(--border2);
      border-top-color: var(--accent2);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p     { font-size: 15px; color: var(--subtle); font-weight: 500; }
    .loading small { font-size: 12px; color: var(--muted); }

    /* ─── Error ─── */
    .error-box {
      display: none;
      background: var(--red-bg);
      border: 1px solid var(--red-bd);
      border-radius: 10px;
      padding: 14px 18px;
      color: #fca5a5;
      font-size: 13px;
      margin-bottom: 20px;
    }

    /* ─── Active page banner ─── */
    .active-banner {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 24px;
      align-items: center;
      gap: 14px;
    }
    .active-banner .ab-icon { font-size: 20px; }
    .active-banner .ab-title { font-size: 15px; font-weight: 700; }
    .active-banner .ab-url   { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .back-btn {
      margin-left: auto;
      padding: 7px 16px;
      border-radius: 7px;
      border: 1px solid var(--border2);
      background: transparent;
      color: var(--subtle);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .back-btn:hover { border-color: var(--accent2); color: #93c5fd; }

    /* ─── Results ─── */
    .results { display: none; }

    /* ─── Stats bar ─── */
    .stats-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 28px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 0;
      flex-wrap: wrap;
    }
    .stat-block {
      flex: 1;
      min-width: 110px;
      padding: 0 22px;
      border-right: 1px solid var(--border);
    }
    .stat-block:first-child { padding-left: 0; }
    .stat-block:last-child  { border-right: none; }
    .stat-num   { font-size: 28px; font-weight: 800; line-height: 1; margin-bottom: 4px; }
    .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }

    .freshness-bar-bg   { height: 7px; background: var(--border2); border-radius: 99px; overflow: hidden; width: 150px; }
    .freshness-bar-fill { height: 100%; border-radius: 99px; transition: width 1s ease; }

    /* ─── Page meta ─── */
    .page-meta {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 22px;
      margin-bottom: 22px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-start;
    }
    .pg-title   { font-size: 16px; font-weight: 700; }
    .pg-topic   { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .pg-summary { font-size: 13px; color: var(--subtle); line-height: 1.6; margin-top: 6px; }
    .page-link  {
      font-size: 12px; color: var(--accent2); text-decoration: none;
      padding: 6px 12px; border: 1px solid var(--accent); border-radius: 6px;
      white-space: nowrap; transition: background 0.15s;
    }
    .page-link:hover { background: rgba(37,99,235,0.1); }

    /* ─── Three-column findings ─── */
    .findings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 18px;
      margin-bottom: 22px;
    }
    @media (max-width: 1100px) { .findings-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 700px)  { .findings-grid { grid-template-columns: 1fr; } }

    .findings-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .findings-panel-header {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .findings-panel-body {
      flex: 1;
      overflow-y: auto;
      max-height: 460px;
    }
    .findings-panel-body::-webkit-scrollbar { width: 4px; }
    .findings-panel-body::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    /* ─── Cards inside panels ─── */
    .finding-card {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
    }
    .finding-card:last-child { border-bottom: none; }

    .severity-pill, .missing-priority {
      display: inline-block;
      font-size: 10px; font-weight: 800;
      letter-spacing: 0.06em; padding: 2px 7px;
      border-radius: 4px; text-transform: uppercase; margin-bottom: 7px;
    }
    .sev-high, .pri-high   { background: rgba(239,68,68,.18);  color: #f87171; }
    .sev-medium,.pri-medium { background: rgba(245,158,11,.18); color: #fbbf24; }
    .sev-low, .pri-low     { background: rgba(59,130,246,.18); color: #93c5fd; }

    .finding-section-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 4px; }
    .finding-original {
      font-size: 12px; color: var(--muted);
      background: var(--bg); border-left: 3px solid var(--red-bd);
      padding: 5px 9px; border-radius: 0 4px 4px 0;
      margin-bottom: 7px; line-height: 1.5; font-style: italic;
    }
    .finding-problem    { font-size: 12px; color: #fca5a5; margin-bottom: 6px; line-height: 1.5; }
    .finding-correction {
      font-size: 13px; color: #86efac;
      background: rgba(34,197,94,0.06); border-left: 3px solid var(--green-bd);
      padding: 6px 9px; border-radius: 0 4px 4px 0; line-height: 1.6;
    }

    .missing-topic   { font-size: 13px; font-weight: 700; color: #93c5fd; margin-bottom: 5px; }
    .missing-why     { font-size: 12px; color: var(--muted); margin-bottom: 7px; line-height: 1.5; }
    .missing-content {
      font-size: 13px; color: #bae6fd;
      background: rgba(59,130,246,0.06); border-left: 3px solid var(--blue-bd);
      padding: 6px 9px; border-radius: 0 4px 4px 0; line-height: 1.6;
    }

    .accurate-section { font-size: 12px; font-weight: 700; color: #86efac; margin-bottom: 4px; }
    .accurate-content { font-size: 13px; color: var(--subtle); line-height: 1.6; }

    .empty-state { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 13px; }

    /* ─── Dot badge ─── */
    .cd { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .cnt-badge {
      font-size: 11px; font-weight: 700;
      padding: 2px 8px; border-radius: 20px; margin-left: auto;
    }

    /* ─── Side-by-side diff ─── */
    .diff-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 28px;
    }
    @media (max-width: 800px) { .diff-row { grid-template-columns: 1fr; } }

    .diff-panel { border-radius: 14px; overflow: hidden; border: 1px solid var(--border); }
    .diff-panel-header {
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .diff-panel-header .dph-left { display: flex; align-items: center; gap: 9px; }
    .diff-panel-header span { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
    .diff-original-header { background: var(--surface2); }
    .diff-updated-header  { background: rgba(34,197,94,0.06); border-bottom-color: var(--green-bd); }
    .diff-body {
      padding: 16px 18px;
      max-height: 500px; overflow-y: auto;
      font-size: 12.5px; line-height: 1.8;
      color: var(--subtle); white-space: pre-wrap; word-break: break-word;
      background: var(--surface);
    }
    .diff-updated-body { background: rgba(34,197,94,0.03); color: #a7f3d0; }
    .diff-body::-webkit-scrollbar { width: 4px; }
    .diff-body::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    /* ─── Download buttons ─── */
    .dl-btn {
      padding: 6px 13px; border-radius: 7px;
      border: 1px solid var(--border2); background: rgba(255,255,255,0.04);
      color: var(--subtle); font-size: 11px; font-weight: 700;
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .dl-btn:hover { background: rgba(255,255,255,0.09); color: var(--text); }
    .dl-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .dl-btn-green { border-color: var(--green-bd); color: #86efac; background: rgba(34,197,94,0.06); }
    .dl-btn-green:hover { background: rgba(34,197,94,0.12); }

    /* freshness colors */
    .fresh-high   { color: var(--green); }
    .fresh-medium { color: var(--gold); }
    .fresh-low    { color: var(--red); }
  </style>
</head>
<body>

<!-- ─── Header ─── -->
<header>
  <div class="iare-logo">IARE</div>
  <div class="header-divider"></div>
  <div>
    <h1>Content Auditor</h1>
    <p>Institute of Aeronautical Engineering · AI-Powered Page Audit Tool</p>
  </div>
  <div class="header-badge">INTERNAL USE ONLY</div>
</header>

<div class="container">

  <!-- ─── Page selector ─── -->
  <div id="selectorSection">
    <div class="selector-label">Select a page to audit</div>
    <div class="pages-grid" id="pagesGrid"></div>
  </div>

  <!-- ─── Error ─── -->
  <div class="error-box" id="errorBox"></div>

  <!-- ─── Loading ─── -->
  <div class="loading" id="loading">
    <div class="loader-ring"></div>
    <p id="loadingMsg">Fetching page content...</p>
    <small id="loadingHint">This usually takes 15–30 seconds</small>
  </div>

  <!-- ─── Active page banner (shown above results) ─── -->
  <div class="active-banner" id="activeBanner">
    <div class="ab-icon" id="bannerIcon"></div>
    <div>
      <div class="ab-title" id="bannerTitle"></div>
      <div class="ab-url"   id="bannerUrl"></div>
    </div>
    <button class="back-btn" onclick="goBack()">← Audit Another Page</button>
  </div>

  <!-- ─── Results ─── -->
  <div class="results" id="results">

    <div class="stats-bar" id="statsBar"></div>
    <div class="page-meta" id="pageMeta"></div>

    <!-- Findings -->
    <div class="findings-grid">

      <div class="findings-panel">
        <div class="findings-panel-header" style="background:var(--red-bg);border-bottom-color:var(--red-bd)">
          <span class="cd" style="background:#ef4444"></span>
          <span style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#f87171">Outdated Information</span>
          <span class="cnt-badge" id="outdatedCount" style="background:rgba(239,68,68,.18);color:#f87171"></span>
        </div>
        <div class="findings-panel-body" id="outdatedList"></div>
      </div>

      <div class="findings-panel">
        <div class="findings-panel-header" style="background:var(--blue-bg);border-bottom-color:var(--blue-bd)">
          <span class="cd" style="background:#3b82f6"></span>
          <span style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#93c5fd">Missing Information</span>
          <span class="cnt-badge" id="missingCount" style="background:rgba(59,130,246,.18);color:#93c5fd"></span>
        </div>
        <div class="findings-panel-body" id="missingList"></div>
      </div>

      <div class="findings-panel">
        <div class="findings-panel-header" style="background:var(--green-bg);border-bottom-color:var(--green-bd)">
          <span class="cd" style="background:#22c55e"></span>
          <span style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#86efac">Still Accurate</span>
          <span class="cnt-badge" id="accurateCount" style="background:rgba(34,197,94,.18);color:#86efac"></span>
        </div>
        <div class="findings-panel-body" id="accurateList"></div>
      </div>

    </div>

    <!-- Diff -->
    <div class="diff-row">
      <div class="diff-panel">
        <div class="diff-panel-header diff-original-header">
          <div class="dph-left">
            <span class="cd" style="background:var(--muted)"></span>
            <span>Original Page Content</span>
          </div>
          <button class="dl-btn" onclick="downloadDoc('original')">⬇ Download</button>
        </div>
        <div class="diff-body" id="originalBody"></div>
      </div>
      <div class="diff-panel">
        <div class="diff-panel-header diff-updated-header">
          <div class="dph-left">
            <span class="cd" style="background:#22c55e"></span>
            <span style="color:#86efac">AI-Updated Full Content</span>
          </div>
          <button class="dl-btn dl-btn-green" onclick="downloadDoc('updated')">⬇ Download Report</button>
        </div>
        <div class="diff-body diff-updated-body" id="updatedBody"></div>
      </div>
    </div>

  </div>
</div>

<script>
// ─── IARE pages config ───
const PAGES = [
  {
    id: 1,
    title: "AI Experience Center",
    url: "https://iare.ac.in/?q=pages/ai-experience-center",
    icon: "🏛️",
    iconBg: "rgba(139,92,246,0.15)",
    desc: "Hands-on AI lab & innovation hub",
  },
  {
    id: 2,
    title: "Generative AI & Fundamental Programming",
    url: "https://iare.ac.in/?q=pages/integrating-generative-al-fundamental-programming",
    icon: "🤖",
    iconBg: "rgba(37,99,235,0.15)",
    desc: "GenAI integration in core programming",
  },
  {
    id: 3,
    title: "Machine Learning Algorithms",
    url: "https://iare.ac.in/?q=pages/machine-learning-algorithms",
    icon: "📊",
    iconBg: "rgba(16,185,129,0.15)",
    desc: "ML techniques, models & applications",
  },
  {
    id: 4,
    title: "AI Software Engineering",
    url: "https://iare.ac.in/?q=pages/ai-software-engineering",
    icon: "⚙️",
    iconBg: "rgba(245,158,11,0.15)",
    desc: "AI-driven software development practices",
  },
  {
    id: 5,
    title: "AI Pair Programming",
    url: "https://iare.ac.in/?q=pages/ai-pair-programming",
    icon: "👥",
    iconBg: "rgba(239,68,68,0.15)",
    desc: "Collaborative coding with AI assistants",
  },
];

// ─── Render page cards ───
function renderCards(disabledId = null) {
  document.getElementById("pagesGrid").innerHTML = PAGES.map(p => `
    <div class="page-card ${p.id === disabledId ? 'active' : ''}" id="card-${p.id}">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="card-icon" style="background:${p.iconBg}">${p.icon}</div>
        <div class="card-num">Page ${p.id}</div>
      </div>
      <div class="card-title">${p.title}</div>
      <div class="card-url">${p.url.replace("https://iare.ac.in/?q=pages/","pages/")}</div>
      <button class="audit-btn" id="btn-${p.id}" onclick="auditPage(${p.id})"
        ${p.id === disabledId ? 'disabled' : ''}>
        ${p.id === disabledId ? '🔍 Auditing...' : 'Audit This Page →'}
      </button>
    </div>
  `).join("");
}
renderCards();

// ─── Loading messages ───
const LOADING_MSGS = [
  ["Fetching page content...", "Downloading HTML from IARE website"],
  ["Parsing the page...", "Extracting headings, paragraphs, and tables"],
  ["Sending to Gemini AI...", "Uploading scraped content for analysis"],
  ["Fact-checking claims...", "Comparing each statement against current knowledge"],
  ["Identifying gaps...", "Finding missing topics and new developments"],
  ["Building report...", "Structuring findings — almost done"],
];
let loadTimer = null;

function startLoading(page) {
  let step = 0;
  const msgEl  = document.getElementById("loadingMsg");
  const hintEl = document.getElementById("loadingHint");
  const update = () => {
    msgEl.textContent  = LOADING_MSGS[step][0];
    hintEl.textContent = LOADING_MSGS[step][1];
    step = Math.min(step + 1, LOADING_MSGS.length - 1);
  };
  update();
  loadTimer = setInterval(update, 4500);

  document.getElementById("selectorSection").style.display = "none";
  document.getElementById("loading").style.display = "flex";
  document.getElementById("results").style.display  = "none";
  document.getElementById("activeBanner").style.display = "none";
  document.getElementById("errorBox").style.display = "none";
}
function stopLoading() { clearInterval(loadTimer); document.getElementById("loading").style.display = "none"; }

// ─── Audit a page ───
let lastResult = null;
let currentPage = null;

async function auditPage(id) {
  const page = PAGES.find(p => p.id === id);
  if (!page) return;
  currentPage = page;

  renderCards(id); // disable the active card's button
  startLoading(page);

  try {
    const res = await fetch("/api/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: page.url }),
    });
    const data = await res.json();
    stopLoading();

    if (!res.ok || !data.success) {
      showError("Error: " + (data.error || "Unknown error"));
      renderCards();
      return;
    }

    lastResult = data;
    renderResults(data, page);

    document.getElementById("bannerIcon").textContent  = page.icon;
    document.getElementById("bannerTitle").textContent = page.title;
    document.getElementById("bannerUrl").textContent   = page.url;
    document.getElementById("activeBanner").style.display = "flex";
    document.getElementById("results").style.display = "block";
    document.getElementById("results").scrollIntoView({ behavior: "smooth" });

  } catch (err) {
    stopLoading();
    showError("Network error: " + err.message);
    renderCards();
  }
}

function goBack() {
  document.getElementById("results").style.display  = "none";
  document.getElementById("activeBanner").style.display = "none";
  document.getElementById("errorBox").style.display = "none";
  document.getElementById("selectorSection").style.display = "block";
  renderCards();
  lastResult = null;
  currentPage = null;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function showError(msg) {
  const box = document.getElementById("errorBox");
  box.textContent = msg;
  box.style.display = "block";
  document.getElementById("selectorSection").style.display = "block";
}

// ─── Strip markdown ───
function stripMd(text) {
  if (!text) return "";
  return String(text)
    .replace(/\*\*(.+?)\*\*/gs, "$1")
    .replace(/\*(.+?)\*/gs, "$1")
    .replace(/^#{1,6}\s+/gm, "")
    .replace(/`{1,3}([^`]*)`{1,3}/g, "$1")
    .replace(/_{1,2}(.+?)_{1,2}/gs, "$1")
    .trim();
}
function escHtml(str) {
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ─── Render results ───
function renderResults(data, page) {
  const a = data.analysis;
  const outdated = a.outdated || [];
  const missing  = a.missing  || [];
  const accurate = a.accurate || [];
  const score    = a.freshnessScore ?? 50;

  const scoreColor = score >= 70 ? "var(--green)" : score >= 40 ? "var(--gold)" : "var(--red)";
  const scoreClass = score >= 70 ? "fresh-high"  : score >= 40 ? "fresh-medium" : "fresh-low";

  // Stats
  document.getElementById("statsBar").innerHTML = `
    <div class="stat-block">
      <div class="stat-num" style="color:var(--red)">${outdated.length}</div>
      <div class="stat-label">Outdated Items</div>
    </div>
    <div class="stat-block">
      <div class="stat-num" style="color:var(--blue)">${missing.length}</div>
      <div class="stat-label">Missing Topics</div>
    </div>
    <div class="stat-block">
      <div class="stat-num" style="color:var(--green)">${accurate.length}</div>
      <div class="stat-label">Still Accurate</div>
    </div>
    <div class="stat-block">
      <div class="stat-num" style="color:var(--gold)">${outdated.length + missing.length}</div>
      <div class="stat-label">Total Issues</div>
    </div>
    <div class="stat-block" style="flex:1.4">
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Content Freshness</div>
      <div class="stat-num ${scoreClass}" style="margin-bottom:6px">${score}<span style="font-size:14px;font-weight:400">/100</span></div>
      <div class="freshness-bar-bg">
        <div class="freshness-bar-fill" id="freshnessBar" style="width:0%;background:${scoreColor}"></div>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:5px">${escHtml(a.estimatedPageAge || "")}</div>
    </div>
  `;
  setTimeout(() => {
    const bar = document.getElementById("freshnessBar");
    if (bar) bar.style.width = score + "%";
  }, 100);

  // Meta
  document.getElementById("pageMeta").innerHTML = `
    <div style="flex:1">
      <div class="pg-title">${escHtml(data.title || page.title)}</div>
      <div class="pg-topic">Topic: ${escHtml(a.topic || "")}</div>
      <div class="pg-summary">${escHtml(stripMd(a.summary || ""))}</div>
    </div>
    <a class="page-link" href="${escHtml(data.url)}" target="_blank">View Page ↗</a>
  `;

  // Counts
  document.getElementById("outdatedCount").textContent = outdated.length;
  document.getElementById("missingCount").textContent  = missing.length;
  document.getElementById("accurateCount").textContent = accurate.length;

  // Outdated
  const sev = { high:0, medium:1, low:2 };
  document.getElementById("outdatedList").innerHTML = [...outdated]
    .sort((a,b) => (sev[a.severity]??1) - (sev[b.severity]??1))
    .map(item => `
      <div class="finding-card">
        <span class="severity-pill sev-${item.severity||'medium'}">${item.severity||'medium'} severity</span>
        <div class="finding-section-label">${escHtml(stripMd(item.section||""))}</div>
        <div class="finding-original">"${escHtml(stripMd(item.originalText||""))}"</div>
        <div class="finding-problem">⚠ ${escHtml(stripMd(item.problem||""))}</div>
        <div class="finding-correction">✓ ${escHtml(stripMd(item.correction||""))}</div>
      </div>`).join("") || `<div class="empty-state">No outdated information found</div>`;

  // Missing
  document.getElementById("missingList").innerHTML = [...missing]
    .sort((a,b) => (sev[a.priority]??1) - (sev[b.priority]??1))
    .map(item => `
      <div class="finding-card">
        <span class="missing-priority pri-${item.priority||'medium'}">${item.priority||'medium'} priority</span>
        <div class="missing-topic">+ ${escHtml(stripMd(item.topic||""))}</div>
        <div class="missing-why">${escHtml(stripMd(item.whyItMatters||""))}</div>
        <div class="missing-content">${escHtml(stripMd(item.newContent||""))}</div>
      </div>`).join("") || `<div class="empty-state">No missing information identified</div>`;

  // Accurate
  document.getElementById("accurateList").innerHTML = accurate
    .map(item => `
      <div class="finding-card">
        <div class="accurate-section">✓ ${escHtml(stripMd(item.section||""))}</div>
        <div class="accurate-content">${escHtml(stripMd(item.content||""))}</div>
      </div>`).join("") || `<div class="empty-state">No confirmed accurate items</div>`;

  // Diff panels
  document.getElementById("originalBody").textContent = data.originalContent || "";
  document.getElementById("updatedBody").textContent  = stripMd(a.updatedFullContent || "");
}

// ─── Download ───
async function downloadDoc(type) {
  if (!lastResult) return;
  const btns = document.querySelectorAll(".dl-btn");
  btns.forEach(b => b.disabled = true);
  try {
    const res = await fetch("/api/download", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        type,
        title:           lastResult.title || (currentPage && currentPage.title),
        url:             lastResult.url,
        originalContent: lastResult.originalContent,
        analysis:        lastResult.analysis,
      }),
    });
    if (!res.ok) { alert("Download failed"); return; }
    const blob = await res.blob();
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = type === "original" ? "original-content.docx" : "ai-updated-report.docx";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(link.href);
  } catch (err) {
    alert("Download error: " + err.message);
  } finally {
    btns.forEach(b => b.disabled = false);
  }
}
</script>

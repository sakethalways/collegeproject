<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Content Auditor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #080d17;
      --surface:  #0f1929;
      --surface2: #162035;
      --border:   #1e2d47;
      --border2:  #253652;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --subtle:   #94a3b8;
      --accent:   #6366f1;
      --red:      #ef4444;
      --red-bg:   #1a0808;
      --red-bd:   #7f1d1d;
      --green:    #22c55e;
      --green-bg: #071a0f;
      --green-bd: #14532d;
      --blue:     #3b82f6;
      --blue-bg:  #060f1e;
      --blue-bd:  #1e3a5f;
      --yellow:   #f59e0b;
      --yellow-bg:#1a1005;
      --yellow-bd:#78350f;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ─── Header ─── */
    header {
      background: linear-gradient(180deg, #0f1929 0%, #080d17 100%);
      border-bottom: 1px solid var(--border);
      padding: 18px 40px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo { font-size: 26px; }
    header h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
    header p  { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* ─── Container ─── */
    .container { max-width: 1440px; margin: 0 auto; padding: 32px 28px; }

    /* ─── Input card ─── */
    .input-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 32px;
      margin-bottom: 28px;
    }
    .input-card label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 10px;
    }
    .url-row { display: flex; gap: 12px; }
    .url-row input {
      flex: 1;
      padding: 13px 18px;
      border-radius: 10px;
      border: 1px solid var(--border2);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .url-row input:focus { border-color: var(--accent); }
    .url-row input::placeholder { color: var(--border2); }

    .btn {
      padding: 13px 26px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: #fff;
      min-width: 130px;
      justify-content: center;
    }
    .btn-primary:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ─── Loading ─── */
    .loading {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 72px 20px;
      gap: 20px;
    }
    .loader-ring {
      width: 52px; height: 52px;
      border: 3px solid var(--border2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-steps { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .loading-steps p { font-size: 15px; color: var(--subtle); font-weight: 500; }
    .loading-steps small { font-size: 12px; color: var(--muted); }

    /* ─── Error ─── */
    .error-box {
      display: none;
      background: var(--red-bg);
      border: 1px solid var(--red-bd);
      border-radius: 10px;
      padding: 14px 18px;
      color: #fca5a5;
      font-size: 13px;
      margin-bottom: 20px;
    }

    /* ─── Results ─── */
    .results { display: none; }

    /* ─── Hero stats bar ─── */
    .stats-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 28px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 0;
      flex-wrap: wrap;
    }
    .stat-block {
      flex: 1;
      min-width: 120px;
      padding: 0 24px;
      border-right: 1px solid var(--border);
    }
    .stat-block:first-child { padding-left: 0; }
    .stat-block:last-child { border-right: none; }
    .stat-num {
      font-size: 30px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }

    /* ─── Freshness meter ─── */
    .freshness-wrap { display: flex; flex-direction: column; gap: 6px; }
    .freshness-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
    .freshness-bar-bg {
      height: 8px;
      background: var(--border2);
      border-radius: 99px;
      overflow: hidden;
      width: 160px;
    }
    .freshness-bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 1s ease;
    }
    .freshness-score { font-size: 22px; font-weight: 800; }

    /* ─── Page meta ─── */
    .page-meta {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 24px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: flex-start;
    }
    .page-meta .pg-title { font-size: 17px; font-weight: 700; flex: 1; }
    .page-meta .pg-meta-row { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .page-meta .pg-summary { font-size: 13px; color: var(--subtle); line-height: 1.6; margin-top: 6px; }
    .page-link {
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
      white-space: nowrap;
      padding: 6px 12px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      transition: background 0.15s;
    }
    .page-link:hover { background: rgba(99,102,241,0.12); }

    /* ─── Section headers ─── */
    .section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title .dot { width: 8px; height: 8px; border-radius: 50%; }
    .cnt-badge {
      margin-left: auto;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 20px;
    }

    /* ─── Three-column findings ─── */
    .findings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    @media (max-width: 1100px) { .findings-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 700px)  { .findings-grid { grid-template-columns: 1fr; } }

    .findings-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .findings-panel-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .findings-panel-body {
      flex: 1;
      overflow-y: auto;
      max-height: 480px;
      padding: 4px 0;
    }
    .findings-panel-body::-webkit-scrollbar { width: 5px; }
    .findings-panel-body::-webkit-scrollbar-track { background: transparent; }
    .findings-panel-body::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    /* ─── Finding card ─── */
    .finding-card {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }
    .finding-card:last-child { border-bottom: none; }

    .severity-pill {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .sev-high   { background: rgba(239,68,68,0.18);  color: #f87171; }
    .sev-medium { background: rgba(245,158,11,0.18); color: #fbbf24; }
    .sev-low    { background: rgba(59,130,246,0.18); color: #93c5fd; }

    .finding-original {
      font-size: 12px;
      color: var(--muted);
      background: var(--bg);
      border-left: 3px solid var(--red-bd);
      padding: 6px 10px;
      border-radius: 0 4px 4px 0;
      margin-bottom: 8px;
      line-height: 1.5;
      font-style: italic;
    }
    .finding-section-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 4px;
    }
    .finding-problem { font-size: 12px; color: #fca5a5; margin-bottom: 6px; line-height: 1.5; }
    .finding-correction {
      font-size: 13px;
      color: #86efac;
      background: rgba(34,197,94,0.06);
      border-left: 3px solid var(--green-bd);
      padding: 7px 10px;
      border-radius: 0 4px 4px 0;
      line-height: 1.6;
    }

    /* Missing card */
    .missing-priority { display: inline-block; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; margin-bottom: 8px; }
    .pri-high   { background: rgba(239,68,68,0.18);  color: #f87171; }
    .pri-medium { background: rgba(245,158,11,0.18); color: #fbbf24; }
    .pri-low    { background: rgba(59,130,246,0.18); color: #93c5fd; }
    .missing-topic  { font-size: 13px; font-weight: 700; color: #93c5fd; margin-bottom: 5px; }
    .missing-why    { font-size: 12px; color: var(--muted); margin-bottom: 8px; line-height: 1.5; }
    .missing-content {
      font-size: 13px;
      color: #bae6fd;
      background: rgba(59,130,246,0.06);
      border-left: 3px solid var(--blue-bd);
      padding: 7px 10px;
      border-radius: 0 4px 4px 0;
      line-height: 1.6;
    }

    /* Accurate card */
    .accurate-section { font-size: 12px; font-weight: 700; color: #86efac; margin-bottom: 4px; }
    .accurate-content { font-size: 13px; color: var(--subtle); line-height: 1.6; }

    /* ─── Side-by-side content diff ─── */
    .diff-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    @media (max-width: 800px) { .diff-row { grid-template-columns: 1fr; } }

    .diff-panel {
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .diff-panel-header {
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .diff-panel-header span { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
    .diff-original-header { background: var(--surface2); }
    .diff-updated-header  { background: rgba(34,197,94,0.07); border-bottom-color: var(--green-bd); }
    .diff-body {
      padding: 18px;
      max-height: 520px;
      overflow-y: auto;
      font-size: 12.5px;
      line-height: 1.8;
      color: var(--subtle);
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--surface);
    }
    .diff-updated-body { background: rgba(34,197,94,0.04); color: #a7f3d0; }
    .diff-body::-webkit-scrollbar { width: 5px; }
    .diff-body::-webkit-scrollbar-track { background: transparent; }
    .diff-body::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    /* ─── Color dots ─── */
    .cd { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .cd-red    { background: var(--red); }
    .cd-green  { background: var(--green); }
    .cd-blue   { background: var(--blue); }
    .cd-yellow { background: var(--yellow); }
    .cd-gray   { background: var(--muted); }

    /* ─── Empty state ─── */
    .empty-state { padding: 32px 18px; text-align: center; color: var(--muted); font-size: 13px; }

    /* ─── Freshrness colors ─── */
    .fresh-high   { color: var(--green); }
    .fresh-medium { color: var(--yellow); }
    .fresh-low    { color: var(--red); }

    /* ─── Download buttons ─── */
    .dl-btn {
      padding: 6px 14px;
      border-radius: 7px;
      border: 1px solid var(--border2);
      background: rgba(255,255,255,0.04);
      color: var(--subtle);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .dl-btn:hover { background: rgba(255,255,255,0.09); color: var(--text); }
    .dl-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .dl-btn-green { border-color: var(--green-bd); color: #86efac; background: rgba(34,197,94,0.06); }
    .dl-btn-green:hover { background: rgba(34,197,94,0.12); color: #4ade80; }
  </style>
</head>
<body>

<header>
  <div class="logo">🔬</div>
  <div>
    <h1>Web Content Auditor</h1>
    <p>AI-powered fact-checker · Detects outdated info · Finds missing content · Suggests updates</p>
  </div>
</header>

<div class="container">

  <div class="input-card">
    <label>Paste a webpage URL to audit</label>
    <div class="url-row">
      <input type="url" id="urlInput" placeholder="https://example.com/page" />
      <button class="btn btn-primary" id="analyzeBtn" onclick="analyze()">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        Audit Page
      </button>
    </div>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div class="loading" id="loading">
    <div class="loader-ring"></div>
    <div class="loading-steps">
      <p id="loadingMsg">Fetching page content...</p>
      <small id="loadingHint">This usually takes 15–30 seconds</small>
    </div>
  </div>

  <div class="results" id="results">

    <!-- Stats bar -->
    <div class="stats-bar" id="statsBar"></div>

    <!-- Page meta -->
    <div class="page-meta" id="pageMeta"></div>

    <!-- Three-column findings -->
    <div class="findings-grid">

      <!-- Outdated -->
      <div class="findings-panel">
        <div class="findings-panel-header" style="background:var(--red-bg);border-bottom-color:var(--red-bd)">
          <span class="cd cd-red"></span>
          <span style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#f87171">Outdated Information</span>
          <span class="cnt-badge" id="outdatedCount" style="background:rgba(239,68,68,.18);color:#f87171;margin-left:auto"></span>
        </div>
        <div class="findings-panel-body" id="outdatedList"></div>
      </div>

      <!-- Missing -->
      <div class="findings-panel">
        <div class="findings-panel-header" style="background:var(--blue-bg);border-bottom-color:var(--blue-bd)">
          <span class="cd cd-blue"></span>
          <span style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#93c5fd">Missing Information</span>
          <span class="cnt-badge" id="missingCount" style="background:rgba(59,130,246,.18);color:#93c5fd;margin-left:auto"></span>
        </div>
        <div class="findings-panel-body" id="missingList"></div>
      </div>

      <!-- Accurate -->
      <div class="findings-panel">
        <div class="findings-panel-header" style="background:var(--green-bg);border-bottom-color:var(--green-bd)">
          <span class="cd cd-green"></span>
          <span style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#86efac">Still Accurate</span>
          <span class="cnt-badge" id="accurateCount" style="background:rgba(34,197,94,.18);color:#86efac;margin-left:auto"></span>
        </div>
        <div class="findings-panel-body" id="accurateList"></div>
      </div>

    </div>

    <!-- Side-by-side diff -->
    <div class="diff-row">
      <div class="diff-panel">
        <div class="diff-panel-header diff-original-header" style="justify-content:space-between">
          <div style="display:flex;align-items:center;gap:10px">
            <span class="cd cd-gray"></span>
            <span>Original Page Content</span>
          </div>
          <button class="dl-btn" onclick="downloadDoc('original')">
            ⬇ Download Original
          </button>
        </div>
        <div class="diff-body" id="originalBody"></div>
      </div>
      <div class="diff-panel">
        <div class="diff-panel-header diff-updated-header" style="justify-content:space-between">
          <div style="display:flex;align-items:center;gap:10px">
            <span class="cd cd-green"></span>
            <span style="color:#86efac">AI-Updated Full Content</span>
          </div>
          <button class="dl-btn dl-btn-green" onclick="downloadDoc('updated')">
            ⬇ Download Report
          </button>
        </div>
        <div class="diff-body diff-updated-body" id="updatedBody"></div>
      </div>
    </div>

  </div>
</div>

<script>
const LOADING_MSGS = [
  ["Fetching page content...", "Downloading HTML from the URL"],
  ["Parsing the page...", "Extracting headings, paragraphs, and tables"],
  ["Sending to Gemini AI...", "Uploading scraped content for analysis"],
  ["Fact-checking claims...", "Comparing each statement against current knowledge"],
  ["Finding gaps...", "Identifying missing topics and new developments"],
  ["Building report...", "Structuring findings — almost done"],
];
let loadingStep = 0;
let loadingTimer = null;

function startLoadingCycle() {
  loadingStep = 0;
  updateLoading();
  loadingTimer = setInterval(() => {
    loadingStep = Math.min(loadingStep + 1, LOADING_MSGS.length - 1);
    updateLoading();
  }, 4500);
}
function stopLoadingCycle() { clearInterval(loadingTimer); }
function updateLoading() {
  const [msg, hint] = LOADING_MSGS[loadingStep];
  document.getElementById("loadingMsg").textContent = msg;
  document.getElementById("loadingHint").textContent = hint;
}

async function analyze() {
  const url = document.getElementById("urlInput").value.trim();
  if (!url) return alert("Please enter a URL.");

  const btn      = document.getElementById("analyzeBtn");
  const loading  = document.getElementById("loading");
  const results  = document.getElementById("results");
  const errorBox = document.getElementById("errorBox");

  btn.disabled = true;
  errorBox.style.display = "none";
  results.style.display = "none";
  loading.style.display = "flex";
  startLoadingCycle();

  try {
    const res = await fetch("/api/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url }),
    });
    const data = await res.json();
    stopLoadingCycle();
    loading.style.display = "none";

    if (!res.ok || !data.success) {
      errorBox.textContent = "Error: " + (data.error || "Unknown error");
      errorBox.style.display = "block";
      return;
    }
    renderResults(data);
    results.style.display = "block";
    results.scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (err) {
    stopLoadingCycle();
    loading.style.display = "none";
    errorBox.textContent = "Network error: " + err.message;
    errorBox.style.display = "block";
  } finally {
    btn.disabled = false;
  }
}

function renderResults(data) {
  lastResult = data; // save for download
  const a = data.analysis;
  const outdated = a.outdated  || [];
  const missing  = a.missing   || [];
  const accurate = a.accurate  || [];
  const score    = a.freshnessScore ?? 50;

  // ── Stats bar
  const scoreColor = score >= 70 ? "var(--green)" : score >= 40 ? "var(--yellow)" : "var(--red)";
  const scoreClass = score >= 70 ? "fresh-high" : score >= 40 ? "fresh-medium" : "fresh-low";
  document.getElementById("statsBar").innerHTML = `
    <div class="stat-block">
      <div class="stat-num" style="color:var(--red)">${outdated.length}</div>
      <div class="stat-label">Outdated Items</div>
    </div>
    <div class="stat-block">
      <div class="stat-num" style="color:var(--blue)">${missing.length}</div>
      <div class="stat-label">Missing Topics</div>
    </div>
    <div class="stat-block">
      <div class="stat-num" style="color:var(--green)">${accurate.length}</div>
      <div class="stat-label">Still Accurate</div>
    </div>
    <div class="stat-block">
      <div class="stat-num" style="color:var(--yellow)">${outdated.length + missing.length}</div>
      <div class="stat-label">Total Issues Found</div>
    </div>
    <div class="stat-block" style="flex:1.5">
      <div class="freshness-label">Content Freshness Score</div>
      <div class="stat-num ${scoreClass}" style="margin-bottom:6px">${score}<span style="font-size:16px;font-weight:400">/100</span></div>
      <div class="freshness-bar-bg">
        <div class="freshness-bar-fill" id="freshnessBar" style="width:0%;background:${scoreColor}"></div>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px">${escHtml(a.estimatedPageAge || "")}</div>
    </div>
  `;
  setTimeout(() => {
    const bar = document.getElementById("freshnessBar");
    if (bar) bar.style.width = score + "%";
  }, 100);

  // ── Page meta
  document.getElementById("pageMeta").innerHTML = `
    <div style="flex:1">
      <div class="pg-title">${escHtml(data.title || data.url)}</div>
      <div class="pg-meta-row">Topic: ${escHtml(a.topic || "")}</div>
      <div class="pg-summary">${escHtml(a.summary || "")}</div>
    </div>
    <a class="page-link" href="${escHtml(data.url)}" target="_blank">View Original ↗</a>
  `;

  // ── Counts
  document.getElementById("outdatedCount").textContent = outdated.length;
  document.getElementById("missingCount").textContent  = missing.length;
  document.getElementById("accurateCount").textContent = accurate.length;

  // ── Outdated list
  const sevOrder = { high: 0, medium: 1, low: 2 };
  const sortedOutdated = [...outdated].sort((a, b) => (sevOrder[a.severity] ?? 1) - (sevOrder[b.severity] ?? 1));
  document.getElementById("outdatedList").innerHTML = sortedOutdated.length
    ? sortedOutdated.map(item => `
      <div class="finding-card">
        <span class="severity-pill sev-${item.severity || 'medium'}">${item.severity || 'medium'} severity</span>
        <div class="finding-section-label">${escHtml(stripMd(item.section || ""))}</div>
        <div class="finding-original">"${escHtml(stripMd(item.originalText || ""))}"</div>
        <div class="finding-problem">⚠ ${escHtml(stripMd(item.problem || ""))}</div>
        <div class="finding-correction">✓ ${escHtml(stripMd(item.correction || ""))}</div>
      </div>`).join("")
    : `<div class="empty-state">No outdated information found</div>`;

  // ── Missing list
  const priOrder = { high: 0, medium: 1, low: 2 };
  const sortedMissing = [...missing].sort((a, b) => (priOrder[a.priority] ?? 1) - (priOrder[b.priority] ?? 1));
  document.getElementById("missingList").innerHTML = sortedMissing.length
    ? sortedMissing.map(item => `
      <div class="finding-card">
        <span class="missing-priority pri-${item.priority || 'medium'}">${item.priority || 'medium'} priority</span>
        <div class="missing-topic">+ ${escHtml(stripMd(item.topic || ""))}</div>
        <div class="missing-why">${escHtml(stripMd(item.whyItMatters || ""))}</div>
        <div class="missing-content">${escHtml(stripMd(item.newContent || ""))}</div>
      </div>`).join("")
    : `<div class="empty-state">No missing information identified</div>`;

  // ── Accurate list
  document.getElementById("accurateList").innerHTML = accurate.length
    ? accurate.map(item => `
      <div class="finding-card">
        <div class="accurate-section">✓ ${escHtml(stripMd(item.section || ""))}</div>
        <div class="accurate-content">${escHtml(stripMd(item.content || ""))}</div>
      </div>`).join("")
    : `<div class="empty-state">No confirmed accurate items</div>`;

  // ── Side-by-side diff
  document.getElementById("originalBody").textContent = data.originalContent || "";
  document.getElementById("updatedBody").textContent  = stripMd(a.updatedFullContent || "");
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// Strip markdown symbols from display text
function stripMd(text) {
  if (!text) return "";
  return String(text)
    .replace(/\*\*(.+?)\*\*/gs, "$1")
    .replace(/\*(.+?)\*/gs, "$1")
    .replace(/^#{1,6}\s+/gm, "")
    .replace(/`{1,3}([^`]*)`{1,3}/g, "$1")
    .replace(/_{1,2}(.+?)_{1,2}/gs, "$1")
    .replace(/~~(.+?)~~/gs, "$1")
    .trim();
}

// ── Download as Word document ──
let lastResult = null; // store the last analysis result for download

async function downloadDoc(type) {
  if (!lastResult) return;
  const btns = document.querySelectorAll(".dl-btn");
  btns.forEach(b => b.disabled = true);

  try {
    const res = await fetch("/api/download", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        type,
        title:           lastResult.title,
        url:             lastResult.url,
        originalContent: lastResult.originalContent,
        analysis:        lastResult.analysis,
      }),
    });

    if (!res.ok) {
      const err = await res.json();
      alert("Download failed: " + (err.error || "Unknown error"));
      return;
    }

    const blob = await res.blob();
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = type === "original" ? "original-content.docx" : "ai-updated-report.docx";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(link.href);
  } catch (err) {
    alert("Download error: " + err.message);
  } finally {
    btns.forEach(b => b.disabled = false);
  }
}

document.getElementById("urlInput").addEventListener("keydown", e => {
  if (e.key === "Enter") analyze();
});
</script>
